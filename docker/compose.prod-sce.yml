name: spartan-compass

networks:
  default:
    external:
      name: sce

services:
  compass-app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: &db_url postgres://postgres:postgres@compass-db:5432/postgres
    env_file:
      - ../.env
    depends_on:
      compass-migrator:
        condition: service_completed_successfully

  compass-migrator:
    build:
      context: ..
      dockerfile: docker/migrator.Dockerfile
    restart: on-failure:3
    environment:
      DATABASE_URL: *db_url
    env_file:
      - ../.env
    depends_on:
      compass-db:
        condition: service_healthy

  compass-db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
